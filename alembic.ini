[alembic]
script_location = %(here)s/migrations
# Revision files: 20261008_<rev>_<slug>.py, sorted by date in the file list
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = src
path_separator = os
timezone = UTC

# Left empty on purpose: env.py takes the URL from APP_DATABASE_URL.
# Override for a one-off run: alembic -x url=postgresql+asyncpg://... upgrade head
sqlalchemy.url =

[post_write_hooks]
# Format generated migrations so CI lint passes without manual fixes
hooks = ruff_format, ruff_fix
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
