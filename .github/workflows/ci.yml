name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs of the same branch / PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "1"          # never re-resolve dependencies in CI, use uv.lock as is
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Verify lock file is up to date with pyproject.toml
        run: uv lock --check
        env:
          UV_FROZEN: "0"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      # docs/openapi.json is committed for reviewers; fail if it no longer matches the code
      - name: OpenAPI schema is up to date
        run: uv run python -m app.api.export_openapi --check

  test:
    name: Tests
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-groups

      # Integration tests start Postgres/RabbitMQ via testcontainers;
      # Docker is available on GitHub-hosted ubuntu runners out of the box.
      # tests/e2e are skipped here (no E2E_BASE_URL); they run in the e2e job.
      - name: Pytest
        run: |
          if [ -d tests ]; then
            uv run pytest --cov --cov-report=term-missing --cov-report=xml
          else
            echo "No tests/ directory yet, skipping"
          fi

      - name: Upload coverage report
        if: hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage.xml

  docker:
    name: Docker build & compose check
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v5

      # docker-compose.yml reads .env via env_file; the repo only ships .env.example
      - name: Prepare env file
        run: cp .env.example .env

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Validate RabbitMQ definitions JSON
        run: python3 -m json.tool infra/rabbitmq/definitions.json > /dev/null

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: subscription-billing:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: End-to-end (docker compose)
    runs-on: ubuntu-24.04
    needs: [test, docker]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-groups

      # Builds and starts the whole stack, then runs tests/e2e (smoke + fault scenarios).
      # The script creates .env from .env.example if it is missing.
      # No --down: the runner is thrown away anyway, and logs are collected on failure.
      - name: End-to-end tests
        run: bash scripts/e2e.sh

      - name: Collect container logs
        if: failure()
        run: docker compose logs --no-color > compose.log || true

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: compose-logs
          path: compose.log