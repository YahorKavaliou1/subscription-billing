[project]
name = "subscription-billing"
version = "0.1.0"
description = "Subscriptions, payments and notifications service (FastAPI + FastStream + PostgreSQL + RabbitMQ, transactional outbox)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # HTTP API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Messaging (RabbitMQ)
    "faststream[rabbit]>=0.5",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # Validation / settings
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Observability
    "structlog>=24.1",
    "prometheus-client>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "testcontainers[postgres,rabbitmq]>=4.7",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
# Точки входа процессов (см. docs/architecture.md, раздел «Компоненты»)
billing-api = "app.api.main:run"
billing-relay = "app.workers.relay:run"
billing-scheduler = "app.workers.scheduler:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "RUF", "ASYNC", "PT", "S"]
ignore = ["S101"]  # assert в тестах

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011"]
"migrations/**" = ["N999"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["app"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: требует реальные Postgres/RabbitMQ (testcontainers)",
    "e2e: поднимает весь стек через docker compose",
]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/app"]
branch = true
