# RabbitMQ broker settings for local development.
# Mounted into /etc/rabbitmq/conf.d/ by docker-compose.yml.
# Topology (exchanges, queues, bindings) lives in definitions.json,
# which the rabbitmq-init service applies via the management API.

# Logging: console only, so `docker compose logs` shows everything.
log.console = true
log.console.level = info
log.file = false

# AMQP heartbeat (seconds): detects dead client connections quickly.
heartbeat = 30

# Redeliver a message if a consumer holds it unacknowledged longer than this (ms).
# 30 minutes: well above the expected notification send time.
consumer_timeout = 1800000

# Resource alarms: block publishers before the node runs out of memory or disk.
# The outbox relay keeps unpublished events in PostgreSQL, so a blocked
# broker only delays delivery and never loses events.
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 1GB

# Management UI / HTTP API (used by rabbitmq-init to load definitions.json).
management.tcp.port = 15672
